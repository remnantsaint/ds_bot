# 首次部署复制为 config.yaml；实际 config.yaml 不提交 Git。
deepseek:
  base_url: "https://api.deepseek.com"
  model: "deepseek-flash"
  thinking: "enabled"
  temperature: 1.3
  max_tokens: 8192
  timeout_seconds: 120

# 将 persona.example.txt 复制为 persona.txt，然后编辑自己的版本。
persona_file: "persona.txt"

reply:
  keywords: ["小鲸"]
  probability: 0.1
  reply_on_at: true
  cooldown_seconds: 300
  max_history: 20

search:
  enabled: true
  max_results: 3
  max_searches: 1
  timeout_seconds: 15
  summary_chars: 1200
