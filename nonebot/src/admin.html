<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>机器人管理</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e5eaf4;background:#101722;color-scheme:dark}body{max-width:920px;margin:auto;padding:24px}h1{font-size:26px}p{color:#a9b6ca;line-height:1.7}.card{background:#1b2636;border:1px solid #324155;border-radius:16px;padding:22px;margin:20px 0}label{display:block;margin:14px 0 6px}input,textarea,button{box-sizing:border-box;font:inherit;border-radius:9px;padding:12px;border:1px solid #465873}input,textarea{width:100%;background:#101722;color:#fff}textarea{min-height:330px;resize:vertical;line-height:1.7}button{background:#80d5bb;color:#10261e;font-weight:650;cursor:pointer;margin-top:14px}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}#notice{position:sticky;top:8px;background:#24394a;padding:12px;border-radius:8px;white-space:pre-wrap}small{color:#b3c2d4}header{display:flex;align-items:center;justify-content:space-between} [hidden]{display:none!important}@media(max-width:600px){body{padding:14px}.grid{grid-template-columns:1fr}.card{padding:16px}}
</style>
<header><div><small>NONEBOT / CONTROL PANEL</small><h1>机器人管理</h1></div><button id="logout" hidden>退出登录</button></header>
<p>电脑、手机，同一个管理入口。人设与下方回复参数保存后即时生效。</p>
<div id="notice" role="status" hidden></div>
<form id="login" class="card"><h2>登录后台</h2><label for="password">管理密码</label><input id="password" type="password" required autocomplete="current-password"><button>登录</button></form>
<main id="panel" hidden><section class="card"><h2>运行状态</h2><p id="status">正在检查…</p><button id="refresh">刷新状态</button></section>
<section class="card"><h2>人设</h2><p>修改后保存，下一轮回答使用新人设。不会清空历史。</p><label for="persona">人设内容</label><textarea id="persona" maxlength="64000"></textarea><button id="savePersona">保存人设</button></section>
<form id="reply" class="card"><h2>回复设置</h2><label><input id="planner_enabled" type="checkbox" style="width:auto"> 启用精简接话与记忆判断</label><div class="grid" id="fields"></div><button>保存回复设置</button><p>模型、关键词和其他高级配置暂通过 config.yaml 管理。</p></form>
<section class="card"><h2>持久记忆</h2><p id="memoryStatus">正在读取…</p><p>原文按群保存，近期消息直接使用，旧消息每日整理，每个周期再合并去重。只发送有限摘要和相关原文。未整理原文不会因上限而删除。</p>
<form id="memoryForm"><label><input id="memory_enabled" type="checkbox" style="width:auto"> 启用记忆记录与整理</label><label><input id="memory_early" type="checkbox" style="width:auto"> 启用当天阈值提前整理</label><label><input id="memory_facts" type="checkbox" style="width:auto"> 启用有来源的事实记忆</label><div class="grid" id="memoryFields"></div><label for="memory_timezone">整理时区（IANA）</label><input id="memory_timezone" value="Asia/Shanghai"><label><input id="memory_verify" type="checkbox" style="width:auto"> 被质疑记错时检索本群原文</label><button>保存记忆设置</button></form></section>
<form id="memorySearch" class="card"><h2>核查原文</h2><div class="grid"><div><label for="searchBot">机器人 QQ</label><input id="searchBot" inputmode="numeric" required></div><div><label for="searchGroup">群号</label><input id="searchGroup" inputmode="numeric" required></div></div><label for="searchQuery">关键词（可搜索已保存的全部原文）</label><input id="searchQuery" maxlength="200" required><button>检索原文</button><pre id="searchResults" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></form><section class="card"><h2>事实核查与纠错</h2><p>先填写上方机器人QQ和群号。冲突不自动选定结论；核对原文后修订或停用旧条目。停用不删除原文和已有摘要。</p><button id="factsLoad">读取本群事实</button> <button id="factsPrev">上一页</button> <button id="factsNext">下一页</button><p id="factsPage"></p><div id="factsList"></div></section></main>
<script>
const $=id=>document.getElementById(id);let loaded=false;
function notice(text){$('notice').hidden=false;$('notice').textContent=text}
async function api(path,method='GET',data){const r=await fetch('/admin/api/'+path,{method,headers:{'Content-Type':'application/json','X-Admin-Request':'1'},body:data===undefined?undefined:JSON.stringify(data)});let v=await r.json();if(!r.ok){if(r.status===401){$('panel').hidden=true;$('login').hidden=false;$('logout').hidden=true}throw Error(typeof v.detail==='string'?v.detail:'请求失败，请检查配置和服务状态')}return v}
const fields={planner_interval_seconds:['普通消息判断间隔（秒）',5,3600],planner_recent_records:['判断参考近期条数',1,10],planner_message_chars:['判断当前消息字符上限',100,1500],planner_input_tokens:['判断内容Token预算',500,4000],planner_timeout_seconds:['判断超时（秒）',1,60],cooldown_seconds:['自动回复冷却（秒）',0,86400],user_cooldown_seconds:['个人提问间隔（秒）',0,3600],delay_min_seconds:['最小发送延迟（秒）',0,60],delay_max_seconds:['最大发送延迟（秒）',0,60],max_pending_per_group:['每群请求上限',1,50],request_timeout_seconds:['请求总超时（秒）',1,600]};
const memoryFields={facts_per_group:["每群事实条目上限",100,50000],fact_context_count:["回答携带事实条数",0,20],context_tokens:["回答时记忆 Token 预算",200,8000],batch_tokens:["整理输入 Token 预算",1000,32000],tool_result_tokens:["检索结果 Token 预算",200,8000],max_tool_searches:['每轮AI检索上限（0关闭）',0,3],tool_result_chars:['AI检索结果总预算（字符）',500,12000],early_records:['提前整理条数阈值',10,10000],early_chars:['提前整理字符阈值',2000,1000000],early_interval_minutes:['提前整理最短间隔（分钟）',5,1440],max_records:['每群原文保留上限',100,100000],recent_records:['近期原文条数',1,200],daily_hour:['每日整理小时',0,23],daily_minute:['每日整理分钟',0,59],merge_days:['合并去重周期（天）',2,90],summary_chars:['摘要长度上限（字符）',200,8000],batch_chars:['整理批次预算（字符）',2000,40000],max_calls_per_run:['每轮整理API调用上限',1,100],context_chars:['回答时记忆预算（字符）',500,12000]};
for(const [key,[name,min,max]] of Object.entries(memoryFields)){let box=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input');label.textContent=name;label.htmlFor='memory_'+key;Object.assign(input,{id:'memory_'+key,type:'number',min,max,step:'1',required:true});box.append(label,input);$('memoryFields').append(box)}
for(const [key,[name,min,max]] of Object.entries(fields)){let box=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input');label.textContent=name;label.htmlFor=key;Object.assign(input,{id:key,type:'number',min,max,step:key==='max_pending_per_group'?'1':'any',required:true});box.append(label,input);$('fields').append(box)}
async function refresh(){const v=await api('state');$('login').hidden=true;$('panel').hidden=false;$('logout').hidden=false;$('status').textContent=(v.online?'QQ 在线':'QQ 离线，请检查 NapCat 登录')+' · 处理或排队中的请求：'+v.pending;if(v.persona_error)notice(v.persona_error);const m=await api('memory');$('memoryStatus').textContent=`原文 ${m.status.records} 条 · 待整理 ${m.status.unprocessed} 条 · 摘要 ${m.status.summaries} 份 · 事实 ${m.status.facts||0} 条 · 分词：${m.tokenizer_mode==='deepseek_official'?'官方数据':'保守估算'}`+(m.last_error?' · 最近整理失败：'+m.last_error:'');if(!loaded){$('persona').value=v.persona;$('planner_enabled').checked=v.reply.planner_enabled;for(const key in fields)$(key).value=v.reply[key];for(const key in memoryFields)$('memory_'+key).value=m.settings[key];$('memory_enabled').checked=m.settings.enabled;$('memory_early').checked=m.settings.early_enabled;$('memory_facts').checked=m.settings.facts_enabled;$('memory_timezone').value=m.settings.timezone;$('memory_verify').checked=m.settings.verify_on_challenge;loaded=true}}
async function run(fn){try{await fn()}catch(e){notice(e.message)}}
$('login').onsubmit=e=>{e.preventDefault();run(async()=>{await api('login','POST',{password:$('password').value});$('password').value='';loaded=false;await refresh();notice('登录成功')})};
$('logout').onclick=()=>run(async()=>{await api('logout','POST',{});loaded=false;$('panel').hidden=true;$('login').hidden=false;$('logout').hidden=true;notice('已退出登录')});
$('refresh').onclick=()=>run(refresh);
$('savePersona').onclick=()=>run(async()=>{let v=await api('persona','PUT',{text:$('persona').value});notice(v.message)});
$('reply').onsubmit=e=>{e.preventDefault();run(async()=>{let data={planner_enabled:$('planner_enabled').checked};for(const key in fields)data[key]=Number($(key).value);notice((await api('reply','PUT',data)).message)})};run(refresh);
$('memoryForm').onsubmit=e=>{e.preventDefault();run(async()=>{let settings={facts_enabled:$('memory_facts').checked,early_enabled:$('memory_early').checked,enabled:$('memory_enabled').checked,timezone:$('memory_timezone').value,verify_on_challenge:$('memory_verify').checked};for(const key in memoryFields)settings[key]=Number($('memory_'+key).value);let payload={settings};let r=await fetch('/admin/api/memory',{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Request':'1'},body:JSON.stringify(payload)});let v=await r.json();if(r.status===409&&v.confirm_required){if(!confirm(v.detail+' 确认保存吗？'))return;v=await api('memory','PUT',{settings,confirm_retention:true})}else if(!r.ok){throw Error(v.detail||'保存失败')}notice(v.message)})};
$('memorySearch').onsubmit=e=>{e.preventDefault();run(async()=>{const v=await api('memory/search','POST',{bot:$('searchBot').value,group:$('searchGroup').value,query:$('searchQuery').value});$('searchResults').textContent=v.results.length?JSON.stringify(v.results,null,2):'未找到相关原文；可能关键词不匹配或记录已超出保留范围。'})};

let factOffset=0;
function factScope(){return {bot:$('searchBot').value,group:$('searchGroup').value}}
async function loadFacts(){
 const scope=factScope(),data=await api('memory/facts','POST',{...scope,offset:factOffset});
 $('factsList').replaceChildren();$('factsPage').textContent=`共 ${data.total} 条 · 第 ${Math.floor(factOffset/50)+1} 页`;
 $('factsPrev').disabled=factOffset===0;$('factsNext').disabled=factOffset+50>=data.total;
 for(const fact of data.facts){
  const box=document.createElement('article'),info=document.createElement('p'),text=document.createElement('textarea'),status=document.createElement('select'),save=document.createElement('button'),remove=document.createElement('button'),details=document.createElement('details'),heading=document.createElement('summary'),source=document.createElement('pre');
  info.textContent=`#${fact.fact_id} · 人物 ${fact.subject_user_id||'未知'} · 发言人 ${(fact.speaker_user_ids||[]).join(',')||'未知'} · ${fact.relation} · ${fact.statement_type||'unknown'}`+(fact.needs_review?' · 有不同说法，待核查':'')+(fact.manually_reviewed?' · 已人工修订':'');
  text.value=fact.content;text.maxLength=500;text.style.minHeight='80px';text.setAttribute('aria-label','事实内容 '+fact.fact_id);
  for(const [value,label] of Object.entries({uncertain:'待核查',confirmed:'已确认',tentative:'提议',cancelled:'已取消'})){const option=document.createElement('option');option.value=value;option.textContent=label;status.append(option)}status.value=fact.status;status.setAttribute('aria-label','事实状态 '+fact.fact_id);
  save.textContent='保存修订';save.onclick=()=>run(async()=>{await api('memory/facts','PUT',{...scope,fact_id:fact.fact_id,action:'edit',content:text.value,status:status.value});await loadFacts();notice('修订已生效，原文保留')});
  remove.textContent='停用条目';remove.onclick=()=>run(async()=>{if(!confirm('停用这条事实？原文和旧摘要仍保留。'))return;await api('memory/facts','PUT',{...scope,fact_id:fact.fact_id,action:'delete'});await loadFacts();notice('该事实已停用；原文和旧摘要仍可能包含相关说法')});
  heading.textContent='查看来源原文与记录';source.style.whiteSpace='pre-wrap';source.style.overflowWrap='anywhere';source.textContent=JSON.stringify({source_available:fact.source_available,conflict_ids:fact.conflict_ids||[],original_content:fact.original_content,records:fact.source_records},null,2);details.append(heading,source);box.append(info,text,status,save,remove,details);$('factsList').append(box);
 }
}
$('factsLoad').onclick=()=>run(async()=>{factOffset=0;await loadFacts()});$('factsPrev').onclick=()=>run(async()=>{factOffset=Math.max(0,factOffset-50);await loadFacts()});$('factsNext').onclick=()=>run(async()=>{factOffset+=50;await loadFacts()});
</script></html>
