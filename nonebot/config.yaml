deepseek:
  base_url: https://api.deepseek.com
  model: deepseek-flash
  thinking: enabled
  temperature: 1.3
  max_tokens: 8192
  timeout_seconds: 120
persona_file: persona.txt
memory:
  enabled: true
  max_records: 10000
  recent_records: 20
  timezone: Asia/Shanghai
  daily_hour: 3
  daily_minute: 0
  merge_days: 10
  summary_chars: 1800
  batch_chars: 12000
  max_calls_per_run: 12
  context_chars: 4000
  verify_on_challenge: true
reply:
  planner_enabled: true
  planner_filter_enabled: false
  planner_interval_seconds: 0
  planner_recent_records: 4
  planner_message_chars: 500
  planner_input_tokens: 1000
  planner_timeout_seconds: 12.0
  keywords:
  - 大肥鱼
  probability: 0
  reply_on_at: true
  cooldown_seconds: 0
  max_history: 20
  max_pending_per_group: 5
  max_concurrent_requests: 3
  request_timeout_seconds: 180.0
  max_message_chars: 4000
  max_context_chars: 16000
  user_cooldown_seconds: 0
  delay_min_seconds: 0
  delay_max_seconds: 0
search:
  enabled: true
  max_results: 3
  max_searches: 1
  timeout_seconds: 15
  summary_chars: 1200
fetch:
  enabled: true
  max_fetches: 2
  timeout_seconds: 30
  content_chars: 6000
briefing:
  enabled: true
  news_commands:
  - 今日新闻
  weather_commands:
  - 今日天气
  - 今日气温
  weather_cache_seconds: 3600
  failure_cache_seconds: 60
  timeout_seconds: 15
