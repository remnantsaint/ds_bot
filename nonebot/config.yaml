# DeepSeek 模型配置
deepseek:
  base_url: "https://api.deepseek.com"
  model: "deepseek-flash"
  thinking: "enabled"
  temperature: 1.3
  max_tokens: 8192
  timeout_seconds: 120

# 人设
persona_file: "persona.txt"
# 回复策略
reply:
  keywords: ["大肥鱼"]
  probability: 0.1
  reply_on_at: true
  cooldown_seconds: 300
  max_history: 20

# DeepSeek 官方搜索：由模型自动决定，按成功的搜索请求另外计费。
search:
  enabled: true
  max_results: 3
  max_searches: 1
  timeout_seconds: 15
  summary_chars: 1200
